<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 'all' }; }
  renderVals() {
    const t = this.state.t;
    const c = (k) => (t === k ? 'cur' : '');
    const s = (k) => () => this.setState({ t: k });
    return {
      showLrn: t === 'all' || t === 'lrn', showShr: t === 'all' || t === 'shr', showHost: t === 'all' || t === 'host',
      cAll: c('all'), cLrn: c('lrn'), cShr: c('shr'), cHost: c('host'),
      oAll: t === 'all', oLrn: t === 'lrn', oShr: t === 'shr', oHost: t === 'host',
      sAll: s('all'), sLrn: s('lrn'), sShr: s('shr'), sHost: s('host')
    };
  }
}
</script>
