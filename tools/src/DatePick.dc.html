<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>日期選擇器</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./wf.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 660px; box-sizing: border-box; padding: 18px; background: #fff; border: 1px solid #a9a9a5; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); display: flex; flex-direction: column; gap: 14px; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #1f1f1f; text-align: left">
<div class="row" style="gap: 8px; flex-wrap: wrap" role="group" aria-label="快速選擇">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="2"><button type="button" class="fbtn {{q.cls}}" aria-pressed="{{q.on}}" onClick="{{q.pick}}">{{q.label}}</button></sc-for>
<span class="small muted" style="align-self: center">或在下面點開始和結束日期</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
<sc-for list="{{months}}" as="m" hint-placeholder-count="2">
<div class="col" style="gap: 8px">
<b style="text-align: center">{{m.title}}</b>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px; text-align: center">
<sc-for list="{{week}}" as="w" hint-placeholder-count="7"><span class="small muted" style="padding: 4px 0">{{w}}</span></sc-for>
<sc-for list="{{m.cells}}" as="c" hint-placeholder-count="35"><button type="button" onClick="{{c.pick}}" disabled="{{c.off}}" aria-label="{{c.aria}}" aria-pressed="{{c.sel}}" style="font: inherit; font-size: 14px; height: 38px; border: 0; cursor: pointer; visibility: {{c.vis}}; background: {{c.bg}}; color: {{c.fg}}; border-radius: {{c.rad}}">{{c.label}}</button></sc-for>
</div>
</div>
</sc-for>
</div>
<div class="row between" style="border-top: 1px solid #e4e4e0; padding-top: 12px">
<span class="small"><b>{{label}}</b></span>
<div class="row" style="gap: 8px"><button type="button" class="btn ghost" style="min-height: 40px" onClick="{{clear}}">清除</button><button type="button" class="btn" style="min-height: 40px" onClick="{{done}}">完成</button></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":null},"ds":{"editor":null},"de":{"editor":null},"onPick":{"editor":null},"onDone":{"editor":null},"$preview":{"width":660,"height":430}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'any', ds: null, de: null }; }
  renderVals() {
    const P = this.props;
    const own = !P.onPick;
    const cur = own ? this.state : { mode: P.mode || 'any', ds: P.ds ?? null, de: P.de ?? null };
    const emit = (v) => (own ? this.setState(v) : P.onPick(v));
    const TODAY = 9;
    const fmt = (n) => (n <= 31 ? '12/' + n : '1/' + (n - 31));
    const lo = cur.ds, hi = cur.de ?? cur.ds;
    const M = [['2026 年 12 月', 2026, 11, 0, 31], ['2027 年 1 月', 2027, 0, 31, 31]];
    const months = M.map(([title, y, m, off, len]) => {
      const first = new Date(y, m, 1).getDay();
      const cells = [];
      for (let i = 0; i < first; i++) cells.push({ label: '', off: true, vis: 'hidden', bg: 'transparent', fg: '#1f1f1f', rad: '0', sel: false, aria: '', pick: () => {} });
      for (let d = 1; d <= len; d++) {
        const n = off + d;
        const past = n < TODAY;
        const edge = cur.mode !== 'any' && (n === lo || n === hi);
        const mid = cur.mode !== 'any' && lo != null && n > lo && n < hi;
        cells.push({
          label: String(d), off: past, vis: 'visible', sel: edge || mid, aria: fmt(n),
          bg: edge ? '#1f1f1f' : mid ? '#e4e4e0' : 'transparent',
          fg: edge ? '#fff' : past ? '#a9a9a5' : '#1f1f1f',
          rad: edge ? '999px' : mid ? '0' : '8px',
          pick: () => {
            if (cur.mode !== 'range' || cur.ds == null || cur.de != null || n < cur.ds) emit({ mode: 'range', ds: n, de: null });
            else emit({ mode: 'range', ds: cur.ds, de: n });
          }
        });
      }
      return { title, cells };
    });
    const label = cur.mode === 'any' ? '不限日期' : cur.mode === 'next' ? '下週：12/14–12/20' : cur.de != null ? fmt(cur.ds) + '–' + fmt(cur.de) : fmt(cur.ds) + ' 起（再點一天當結束日）';
    const Q = [['any', '不限日期', { mode: 'any', ds: null, de: null }], ['next', '下週（12/14–12/20）', { mode: 'next', ds: 14, de: 20 }]];
    return {
      week: ['日', '一', '二', '三', '四', '五', '六'], months, label,
      quick: Q.map(([k, l, v]) => ({ label: l, on: cur.mode === k, cls: cur.mode === k ? 'cur' : '', pick: () => emit(v) })),
      clear: () => emit({ mode: 'any', ds: null, de: null }),
      done: () => { if (P.onDone) P.onDone(); }
    };
  }
}
</script>
</body>
</html>
